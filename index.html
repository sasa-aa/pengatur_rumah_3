<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulasi Desainer Interior - by Sasa</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .font-watermark {
            font-family: 'Dancing Script', cursive;
        }

        /* Prevent touch scrolling during drag on mobile devices */
        .touch-none {
            touch-action: none !important;
        }

        /* Custom Scrollbar for Catalog and Modals */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Active selection border styling */
        .furniture-active {
            outline: 3px dashed #0d9488;
            outline-offset: 4px;
            filter: drop-shadow(0 10px 15px rgba(13, 148, 136, 0.3));
        }

        /* Furniture Touch Target Expansion */
        .furniture-item {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            will-change: transform, left, top;
        }

        /* Wallpapers for wall customizer */
        .wallpaper-stripes {
            background-image: repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(255,255,255,0.15) 20px, rgba(255,255,255,0.15) 40px);
        }
        .wallpaper-dots {
            background-image: radial-gradient(rgba(255,255,255,0.2) 2px, transparent 2px);
            background-size: 20px 20px;
        }
        .wallpaper-modern {
            background-image: linear-gradient(135deg, rgba(255,255,255,0.1) 25%, transparent 25%), linear-gradient(225deg, rgba(255,255,255,0.1) 25%, transparent 25%), linear-gradient(45deg, rgba(255,255,255,0.1) 25%, transparent 25%), linear-gradient(315deg, rgba(255,255,255,0.1) 25%, transparent 25%);
            background-position: 10px 0, 10px 0, 0 0, 0 0;
            background-size: 20px 20px;
        }

        .btn-touch {
            min-width: 44px;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen w-screen overflow-hidden flex flex-col select-none">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-slate-200 px-3 md:px-5 py-2.5 flex items-center justify-between z-30 shrink-0 shadow-sm">
        <!-- Logo & Title -->
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-teal-600 text-white flex items-center justify-center text-xl font-bold shadow-md shadow-teal-600/20">
                <i class="fa-solid fa-couch"></i>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="font-bold text-slate-800 text-base leading-tight">Studio Interior</h1>
                    <span class="bg-teal-100 text-teal-800 text-[10px] font-bold px-2 py-0.5 rounded-full">Multi-User Ready</span>
                </div>
                <p class="text-xs text-slate-500 hidden sm:block">Simulasi Desain Interaktif oleh <span class="font-bold text-teal-600">Sasa</span></p>
            </div>
        </div>

        <!-- Action Controls Bar -->
        <div class="flex items-center gap-1 sm:gap-2">
            <button id="btn-undo" onclick="undo()" title="Urungkan (Undo)" class="btn-touch p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm transition font-medium disabled:opacity-40">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button id="btn-redo" onclick="redo()" title="Ulangi (Redo)" class="btn-touch p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm transition font-medium disabled:opacity-40">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            
            <div class="h-6 w-[1px] bg-slate-200 mx-0.5 sm:mx-1"></div>

            <button onclick="saveToLocalStorage()" title="Simpan Draf" class="btn-touch px-2.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
                <i class="fa-solid fa-floppy-disk text-teal-600"></i>
                <span class="hidden md:inline">Simpan Draf</span>
            </button>

            <button onclick="openShareModal()" title="Bagikan Kode" class="btn-touch px-2.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
                <i class="fa-solid fa-share-nodes text-indigo-600"></i>
                <span class="hidden md:inline">Berbagi Kode</span>
            </button>

            <button onclick="clearRoom()" title="Bersihkan Ruangan" class="btn-touch p-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-sm transition font-medium">
                <i class="fa-solid fa-trash-arrow-up"></i>
            </button>

            <div class="h-6 w-[1px] bg-slate-200 mx-0.5 sm:mx-1"></div>

            <button onclick="togglePreviewMode()" class="btn-touch px-3 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs md:text-sm font-semibold transition flex items-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-eye"></i>
                <span class="hidden sm:inline">Preview</span>
            </button>
            
            <button onclick="exportDesignImage()" class="btn-touch px-3 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-xs md:text-sm font-semibold transition flex items-center gap-1.5 shadow-md shadow-teal-600/20">
                <i class="fa-solid fa-download"></i>
                <span>Simpan Gambar</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Left Sidebar: Furniture Catalog -->
        <aside id="sidebar-catalog" class="w-80 md:w-80 bg-white border-r border-slate-200 flex flex-col shrink-0 z-20 shadow-lg md:shadow-none transition-all duration-300 absolute md:relative inset-y-0 left-0 -translate-x-full md:translate-x-0">
            <!-- Sidebar Header & Search -->
            <div class="p-3 border-b border-slate-100 bg-slate-50/50 flex flex-col gap-2">
                <div class="flex items-center justify-between">
                    <span class="font-bold text-slate-800 text-sm flex items-center gap-2">
                        <i class="fa-solid fa-boxes-packing text-teal-600"></i> Katalog Furnitur
                    </span>
                    <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-slate-600 p-1">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                
                <!-- Search Box -->
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="search-input" oninput="filterCatalog()" placeholder="Cari sofa, meja, tanaman, bed..." class="w-full pl-9 pr-3 py-2 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 transition">
                </div>
            </div>

            <!-- Category Tabs -->
            <div class="flex border-b border-slate-200 overflow-x-auto no-scrollbar bg-white text-xs font-semibold">
                <button onclick="selectCategory('all')" id="cat-all" class="cat-btn px-3 py-2.5 border-b-2 border-teal-600 text-teal-600 whitespace-nowrap flex-1 text-center">Semua</button>
                <button onclick="selectCategory('living')" id="cat-living" class="cat-btn px-3 py-2.5 border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap flex-1 text-center">Tamu</button>
                <button onclick="selectCategory('family')" id="cat-family" class="cat-btn px-3 py-2.5 border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap flex-1 text-center">Keluarga</button>
                <button onclick="selectCategory('bedroom')" id="cat-bedroom" class="cat-btn px-3 py-2.5 border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap flex-1 text-center">Kamar</button>
                <button onclick="selectCategory('study')" id="cat-study" class="cat-btn px-3 py-2.5 border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap flex-1 text-center">Belajar</button>
            </div>

            <!-- Item List Grid -->
            <div id="catalog-grid" class="flex-1 overflow-y-auto p-3 grid grid-cols-2 gap-2.5">
                <!-- Furniture items injected dynamically via JS -->
            </div>
        </aside>

        <!-- Sidebar Mobile Toggle Overlay Button -->
        <button id="mobile-catalog-toggle" onclick="toggleMobileSidebar()" class="md:hidden absolute top-4 left-4 z-20 bg-white border border-slate-200 text-slate-700 rounded-full p-3 shadow-lg flex items-center justify-center btn-touch">
            <i class="fa-solid fa-plus text-teal-600 text-lg"></i>
        </button>

        <!-- Center Main Workspace: Room Canvas -->
        <main class="flex-1 flex flex-col bg-slate-200 relative overflow-hidden">
            
            <!-- Room Controls Bar -->
            <div class="bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-2 flex flex-wrap items-center justify-between gap-2 z-10 text-xs">
                <!-- Room Preset Selector -->
                <div class="flex items-center gap-2">
                    <span class="font-semibold text-slate-600 hidden sm:inline">Jenis Ruangan:</span>
                    <select id="room-preset-select" onchange="changeRoomType(this.value)" class="bg-slate-100 border border-slate-200 rounded-lg px-2.5 py-1.5 font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-500">
                        <option value="living">Ruang Tamu Minimalis</option>
                        <option value="family">Ruang Keluarga Hangat</option>
                        <option value="bedroom">Kamar Tidur Modern</option>
                    </select>
                </div>

                <!-- Room Wall Customizers -->
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-1.5">
                        <span class="text-slate-500">Warna Dinding:</span>
                        <input type="color" id="wall-color-picker" value="#f1f5f9" onchange="changeWallColor(this.value)" class="w-7 h-7 rounded cursor-pointer border-0 bg-transparent">
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="text-slate-500">Wallpaper:</span>
                        <select onchange="changeWallpaper(this.value)" class="bg-slate-100 border border-slate-200 rounded-lg px-2 py-1 font-medium text-slate-700 focus:outline-none">
                            <option value="none">Polos</option>
                            <option value="stripes">Garis-Garis</option>
                            <option value="dots">Bintik Modern</option>
                            <option value="modern">Geometris</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Canvas Viewport -->
            <div id="canvas-container" class="flex-1 relative overflow-hidden flex items-center justify-center p-2 sm:p-6">
                <!-- Room Canvas Element -->
                <div id="room-canvas" class="relative w-full h-full max-w-5xl max-h-[750px] bg-white rounded-2xl shadow-2xl overflow-hidden border-4 border-white touch-none transition-colors duration-500">
                    
                    <!-- Wall Region -->
                    <div id="room-wall" class="absolute top-0 left-0 right-0 h-[68%] transition-colors duration-300">
                        <div id="wallpaper-overlay" class="absolute inset-0 opacity-40"></div>
                        <!-- Window Decor -->
                        <div class="absolute top-8 right-12 w-32 h-44 bg-sky-200/50 border-4 border-white/80 rounded-t-full shadow-inner overflow-hidden flex flex-col justify-between p-1">
                            <div class="w-full h-full border border-white/60 rounded-t-full relative">
                                <div class="absolute inset-x-0 top-1/2 h-1 bg-white/60"></div>
                                <div class="absolute inset-y-0 left-1/2 w-1 bg-white/60"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Floor Region -->
                    <div id="room-floor" class="absolute bottom-0 left-0 right-0 h-[32%] bg-gradient-to-b from-amber-800 to-amber-950 border-t-8 border-amber-900/30 shadow-inner">
                        <div class="w-full h-full opacity-10 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px]"></div>
                    </div>

                    <!-- Room Items Layer -->
                    <div id="furniture-layer" class="absolute inset-0 touch-none"></div>

                    <!-- Floating Control Toolbar Fixed at Top-Center -->
                    <div id="floating-toolbar" class="hidden absolute top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white backdrop-blur-md rounded-2xl px-3 py-1.5 shadow-2xl flex items-center gap-1 border border-slate-700/80 transition-all duration-200">
                        <button onclick="rotateActiveItem(-15)" title="Putar Kiri" class="btn-touch p-2 hover:bg-slate-700/80 rounded-xl text-xs sm:text-sm"><i class="fa-solid fa-rotate-left text-teal-400"></i></button>
                        <button onclick="rotateActiveItem(15)" title="Putar Kanan" class="btn-touch p-2 hover:bg-slate-700/80 rounded-xl text-xs sm:text-sm"><i class="fa-solid fa-rotate-right text-teal-400"></i></button>
                        <div class="w-[1px] h-5 bg-slate-700"></div>
                        <button onclick="scaleActiveItem(1.1)" title="Perbesar" class="btn-touch p-2 hover:bg-slate-700/80 rounded-xl text-xs sm:text-sm"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                        <button onclick="scaleActiveItem(0.9)" title="Perkecil" class="btn-touch p-2 hover:bg-slate-700/80 rounded-xl text-xs sm:text-sm"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                        <div class="w-[1px] h-5 bg-slate-700"></div>
                        <button onclick="changeLayer('up')" title="Bawa Lebih Maju" class="btn-touch p-2 hover:bg-slate-700/80 rounded-xl text-xs sm:text-sm"><i class="fa-solid fa-layer-group"></i>▲</button>
                        <button onclick="changeLayer('down')" title="Bawa Lebih Mundur" class="btn-touch p-2 hover:bg-slate-700/80 rounded-xl text-xs sm:text-sm"><i class="fa-solid fa-layer-group"></i>▼</button>
                        <div class="w-[1px] h-5 bg-slate-700"></div>
                        <button onclick="duplicateActiveItem()" title="Duplikasi" class="btn-touch p-2 hover:bg-slate-700/80 text-teal-400 rounded-xl text-xs sm:text-sm"><i class="fa-solid fa-clone"></i></button>
                        <button onclick="deleteActiveItem()" title="Hapus" class="btn-touch p-2 hover:bg-rose-600/80 text-rose-400 hover:text-white rounded-xl text-xs sm:text-sm"><i class="fa-solid fa-trash"></i></button>
                    </div>

                    <!-- Watermark Hak Cipta "by Sasa" di Pojok Kanan Bawah Canvas -->
                    <div class="absolute bottom-3 right-4 z-20 pointer-events-none select-none text-right">
                        <p class="font-watermark text-2xl sm:text-3xl font-bold text-white/80 drop-shadow-[0_2px_5px_rgba(0,0,0,0.6)]">by Sasa</p>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Share/Export JSON Modal -->
    <div id="share-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                    <i class="fa-solid fa-share-nodes text-indigo-600"></i> Berbagi Kode Desain
                </h3>
                <button onclick="closeShareModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <p class="text-xs text-slate-500">Salin kode di bawah untuk membagikan tata letak ruangan Anda ke teman, atau tempel kode dari teman untuk memuat desain mereka.</p>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Kode JSON Desain:</label>
                <textarea id="share-json-input" class="w-full h-28 bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500 select-all"></textarea>
            </div>

            <div class="flex items-center justify-end gap-2">
                <button onclick="copyShareCode()" class="btn-touch px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl text-xs font-bold transition">
                    <i class="fa-solid fa-copy mr-1"></i> Salin Kode
                </button>
                <button onclick="importShareCode()" class="btn-touch px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition">
                    <i class="fa-solid fa-file-import mr-1"></i> Impor Desain
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-teal-400"></i>
        <span id="toast-msg">Pesan...</span>
    </div>

        let placedItems = [];

        let dragOffsetX = 0;
        let dragOffsetY = 0;

        window.onload = function() {
            renderCatalog();
            loadFromLocalStorage();
        };

        // Render Catalog Grid Items
        function renderCatalog() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';

            const filtered = FURNITURE_CATALOG.filter(item => {
                const matchesCat = (currentCategory === 'all' || item.category === currentCategory);
                const query = document.getElementById('search-input').value.toLowerCase();
                const matchesSearch = item.name.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center py-8 text-slate-400 text-xs">Tidak ada furnitur ditemukan</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-50 hover:bg-teal-50/50 border border-slate-200 hover:border-teal-400 rounded-xl p-2.5 flex flex-col items-center justify-between cursor-pointer transition shadow-sm group";
                card.onclick = () => addFurnitureToRoom(item.id);

                card.innerHTML = `
                    <div class="w-16 h-16 flex items-center justify-center p-1 group-hover:scale-105 transition-transform">
                        ${item.svg}
                    </div>
                    <p class="text-[11px] font-semibold text-slate-700 text-center mt-1.5 leading-snug line-clamp-2">${item.name}</p>
                    <button class="mt-2 text-[10px] font-bold text-teal-700 bg-teal-100 hover:bg-teal-600 hover:text-white px-2 py-1 rounded-md w-full transition flex items-center justify-center gap-1">
                        <i class="fa-solid fa-plus"></i> Tambah
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        // Category Filter Tabs
        function selectCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('border-teal-600', 'text-teal-600');
                btn.classList.add('border-transparent', 'text-slate-500');
            });

            const activeBtn = document.getElementById(`cat-${cat}`);
            if (activeBtn) {
                activeBtn.classList.remove('border-transparent', 'text-slate-500');
                activeBtn.classList.add('border-teal-600', 'text-teal-600');
            }
            renderCatalog();
        }

        function filterCatalog() {
            renderCatalog();
        }

        // Add Furniture to Room Canvas
        function addFurnitureToRoom(catalogId) {
            const template = FURNITURE_CATALOG.find(i => i.id === catalogId);
            if (!template) return;

            zCounter++;
            const newItem = {
                instanceId: 'item-' + Date.now(),
                catalogId: template.id,
                name: template.name,
                width: template.width,
                height: template.height,
                svg: template.svg,
                x: 150 + (placedItems.length * 10) % 100,
                y: 150 + (placedItems.length * 10) % 100,
                rotation: 0,
                scale: 1,
                zIndex: zCounter
            };

            placedItems.push(newItem);
            saveHistory();
            renderRoomItems();
            setActiveItem(newItem.instanceId);
            showToast(`${template.name} ditambahkan`);
        }

        function renderRoomItems() {
            const container = document.getElementById('furniture-layer');
            container.innerHTML = '';

            placedItems.forEach(item => {
                const el = document.createElement('div');
                el.id = item.instanceId;
                el.className = `furniture-item absolute cursor-grab active:cursor-grabbing p-1 ${activeItemId === item.instanceId ? 'furniture-active z-40' : ''}`;
                el.style.left = `${item.x}px`;
                el.style.top = `${item.y}px`;
                el.style.width = `${item.width * item.scale}px`;
                el.style.height = `${item.height * item.scale}px`;
                el.style.transform = `rotate(${item.rotation}deg)`;
                el.style.zIndex = item.zIndex;

                el.innerHTML = item.svg;

                // Event Listeners for Touch and Mouse Dragging
                el.addEventListener('mousedown', (e) => startDrag(e, item.instanceId));
                el.addEventListener('touchstart', (e) => startDrag(e, item.instanceId), {passive: false});

                container.appendChild(el);
            });

            updateFloatingToolbar();
        }

        // Drag Event Handler
        function startDrag(e, id) {
            e.stopPropagation();
            if (e.touches && e.touches.length > 1) return;

            setActiveItem(id);
            isDragging = true;

            const canvasBounds = document.getElementById('room-canvas').getBoundingClientRect();
            const item = placedItems.find(i => i.instanceId === id);

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            dragOffsetX = clientX - (canvasBounds.left + item.x);
            dragOffsetY = clientY - (canvasBounds.top + item.y);

            document.addEventListener('mousemove', onDrag, {passive: false});
            document.addEventListener('touchmove', onDrag, {passive: false});
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
        }

        function onDrag(e) {
            if (!isDragging || !activeItemId) return;
            if (e.cancelable) e.preventDefault();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const canvasBounds = document.getElementById('room-canvas').getBoundingClientRect();
            const item = placedItems.find(i => i.instanceId === activeItemId);

            if (item) {
                let newX = clientX - canvasBounds.left - dragOffsetX;
                let newY = clientY - canvasBounds.top - dragOffsetY;

                const scaledW = item.width * item.scale;
                const scaledH = item.height * item.scale;

                item.x = Math.max(-scaledW / 2, Math.min(canvasBounds.width - scaledW / 2, newX));
                item.y = Math.max(-scaledH / 2, Math.min(canvasBounds.height - scaledH / 2, newY));

                const el = document.getElementById(item.instanceId);
                if (el) {
                    el.style.left = `${item.x}px`;
                    el.style.top = `${item.y}px`;
                }
            }
        }

        function endDrag() {
            if (isDragging) {
                isDragging = false;
                saveHistory();
            }
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('touchmove', onDrag);
            document.removeEventListener('mouseup', endDrag);
            document.removeEventListener('touchend', endDrag);
        }

        function setActiveItem(id) {
            activeItemId = id;
            renderRoomItems();
        }

        function updateFloatingToolbar() {
            const toolbar = document.getElementById('floating-toolbar');
            if (!activeItemId) {
                toolbar.classList.add('hidden');
                return;
            }
            toolbar.classList.remove('hidden');
        }

        function rotateActiveItem(deg) {
            if (!activeItemId) return;
            const item = placedItems.find(i => i.instanceId === activeItemId);
            if (item) {
                item.rotation = (item.rotation + deg) % 360;
                renderRoomItems();
                saveHistory();
            }
        }

        function scaleActiveItem(factor) {
            if (!activeItemId) return;
            const item = placedItems.find(i => i.instanceId === activeItemId);
            if (item) {
                item.scale = Math.max(0.4, Math.min(2.5, item.scale * factor));
                renderRoomItems();
                saveHistory();
            }
        }

        function changeLayer(direction) {
            if (!activeItemId) return;
            const item = placedItems.find(i => i.instanceId === activeItemId);
            if (item) {
                if (direction === 'up') item.zIndex += 1;
                else item.zIndex = Math.max(1, item.zIndex - 1);
                renderRoomItems();
                saveHistory();
            }
        }

        function duplicateActiveItem() {
            if (!activeItemId) return;
            const item = placedItems.find(i => i.instanceId === activeItemId);
            if (item) {
                zCounter++;
                const dup = {
                    ...item,
                    instanceId: 'item-' + Date.now(),
                    x: item.x + 20,
                    y: item.y + 20,
                    zIndex: zCounter
                };
                placedItems.push(dup);
                saveHistory();
                setActiveItem(dup.instanceId);
                showToast('Furnitur diduplikasi');
            }
        }

        function deleteActiveItem() {
            if (!activeItemId) return;
            placedItems = placedItems.filter(i => i.instanceId !== activeItemId);
            activeItemId = null;
            renderRoomItems();
            saveHistory();
            showToast('Furnitur dihapus');
        }

        function changeRoomType(type) {
            const wall = document.getElementById('room-wall');
            const floor = document.getElementById('room-floor');

            if (type === 'living') {
                wall.style.backgroundColor = '#f1f5f9';
                floor.className = "absolute bottom-0 left-0 right-0 h-[32%] bg-gradient-to-b from-amber-800 to-amber-950 border-t-8 border-amber-900/30 shadow-inner";
            } else if (type === 'family') {
                wall.style.backgroundColor = '#fef3c7';
                floor.className = "absolute bottom-0 left-0 right-0 h-[32%] bg-gradient-to-b from-slate-700 to-slate-900 border-t-8 border-slate-800 shadow-inner";
            } else if (type === 'bedroom') {
                wall.style.backgroundColor = '#e0f2fe';
                floor.className = "absolute bottom-0 left-0 right-0 h-[32%] bg-gradient-to-b from-amber-900 to-amber-950 border-t-8 border-amber-900/30 shadow-inner";
            }
        }

        function changeWallColor(color) {
            document.getElementById('room-wall').style.backgroundColor = color;
        }

        function changeWallpaper(pattern) {
            const overlay = document.getElementById('wallpaper-overlay');
            overlay.className = 'absolute inset-0 opacity-40 ';
            if (pattern !== 'none') {
                overlay.classList.add(`wallpaper-${pattern}`);
            }
        }

        function saveHistory() {
            historyStack.push(JSON.stringify(placedItems));
            redoStack = [];
            updateUndoRedoButtons();
        }

        function undo() {
            if (historyStack.length > 1) {
                redoStack.push(historyStack.pop());
                const prev = historyStack[historyStack.length - 1];
                placedItems = JSON.parse(prev);
                renderRoomItems();
                updateUndoRedoButtons();
            }
        }

        function redo() {
            if (redoStack.length > 0) {
                const next = redoStack.pop();
                historyStack.push(next);
                placedItems = JSON.parse(next);
                renderRoomItems();
                updateUndoRedoButtons();
            }
        }

        function updateUndoRedoButtons() {
            document.getElementById('btn-undo').disabled = historyStack.length <= 1;
            document.getElementById('btn-redo').disabled = redoStack.length === 0;
        }

        function saveToLocalStorage() {
            localStorage.setItem('sasa_interior_design', JSON.stringify(placedItems));
            showToast('Draf disimpan di browser');
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('sasa_interior_design');
            if (saved) {
                placedItems = JSON.parse(saved);
                saveHistory();
                renderRoomItems();
            } else {
                saveHistory();
            }
        }

        function clearRoom() {
            if (placedItems.length === 0) return;
            placedItems = [];
            activeItemId = null;
            saveHistory();
            renderRoomItems();
            showToast('Ruangan dibersihkan');
        }

        function togglePreviewMode() {
            const sidebar = document.getElementById('sidebar-catalog');
            sidebar.classList.toggle('hidden');
            setActiveItem(null);
        }

        function openShareModal() {
            document.getElementById('share-json-input').value = JSON.stringify(placedItems);
            document.getElementById('share-modal').classList.remove('hidden');
        }

        function closeShareModal() {
            document.getElementById('share-modal').classList.add('hidden');
        }

        function copyShareCode() {
            const textarea = document.getElementById('share-json-input');
            textarea.select();
            document.execCommand('copy');
            showToast('Kode berhasil disalin!');
        }

        function importShareCode() {
            try {
                const json = document.getElementById('share-json-input').value;
                placedItems = JSON.parse(json);
                saveHistory();
                renderRoomItems();
                closeShareModal();
                showToast('Desain berhasil diimpor!');
            } catch (err) {
                showToast('Format kode JSON tidak valid!');
            }
        }

        function exportDesignImage() {
            setActiveItem(null);
            showToast('Menyiapkan gambar PNG HD...');

            const roomCanvas = document.getElementById('room-canvas');
            const width = roomCanvas.clientWidth;
            const height = roomCanvas.clientHeight;

            const canvas = document.createElement('canvas');
            canvas.width = width * 2;
            canvas.height = height * 2;
            const ctx = canvas.getContext('2d');
            ctx.scale(2, 2);

            const wallColor = getComputedStyle(document.getElementById('room-wall')).backgroundColor;
            ctx.fillStyle = wallColor;
            ctx.fillRect(0, 0, width, height * 0.68);

            ctx.fillStyle = '#78350f';
            ctx.fillRect(0, height * 0.68, width, height * 0.32);

            const drawWatermark = () => {
                ctx.save();
                ctx.font = 'bold 30px "Dancing Script", cursive, sans-serif';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
                ctx.shadowBlur = 6;
                ctx.fillText('by Sasa', width - 20, height - 15);
                ctx.restore();
            };

            let loadedCount = 0;
            const sortedItems = [...placedItems].sort((a,b) => a.zIndex - b.zIndex);

            if (sortedItems.length === 0) {
                drawWatermark();
                downloadCanvas(canvas);
                return;
            }

            sortedItems.forEach(item => {
                const img = new Image();
                const svgBlob = new Blob([item.svg], {type: 'image/svg+xml;charset=utf-8'});
                const url = URL.createObjectURL(svgBlob);

                img.onload = function() {
                    ctx.save();
                    const cx = item.x + (item.width * item.scale) / 2;
                    const cy = item.y + (item.height * item.scale) / 2;
                    
                    ctx.translate(cx, cy);
                    ctx.rotate((item.rotation * Math.PI) / 180);
                    ctx.drawImage(img, -(item.width * item.scale)/2, -(item.height * item.scale)/2, item.width * item.scale, item.height * item.scale);
                    ctx.restore();

                    URL.revokeObjectURL(url);
                    loadedCount++;

                    if (loadedCount === sortedItems.length) {
                        drawWatermark();
                        downloadCanvas(canvas);
                    }
                };
                img.src = url;
            });
        }

        function downloadCanvas(canvas) {
            const link = document.createElement('a');
            link.download = `Desain-Interior-by-Sasa-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar-catalog');
            sidebar.classList.toggle('-translate-x-full');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2500);
        }
